name: Native checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Notty/**"
      - "Notty.xcodeproj/**"
      - "Packages/**"
      - ".github/workflows/native-checks.yml"

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-checks:
    name: Core tests and unsigned iPad builds
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify native toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks
          case "$(sw_vers -productVersion)" in
            27.*) ;;
            *) printf 'macOS 27 is required for native stroke tests.\n' >&2; exit 1 ;;
          esac
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          for sdk in macosx27.0 iphoneos27.0 iphonesimulator27.0; do
            test "$(xcrun --sdk "$sdk" --show-sdk-version)" = "27.0"
          done

      - name: Test notebook core and native stroke archives
        run: |
          xcrun --sdk macosx27.0 swift test --package-path Packages/NottyCore --parallel --num-workers 2

      - name: Compile unsigned iPad simulator app
        run: |
          xcodebuild \
            -project Notty.xcodeproj \
            -scheme Notty \
            -configuration Debug \
            -sdk iphonesimulator27.0 \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/NottySimulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Compile unsigned iPad device app
        run: |
          xcodebuild \
            -project Notty.xcodeproj \
            -scheme Notty \
            -configuration Release \
            -sdk iphoneos27.0 \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NottyDevice" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Record result
        if: always()
        run: |
          {
            printf '### Native checks\n\n'
            printf 'Source revision: `%s`\n\n' "$GITHUB_SHA"
            printf 'Job result: `%s`\n\n' "${{ job.status }}"
            printf 'Unsigned simulator/device compilation and macOS storage, geometry, and native stroke tests. Physical iPad acceptance is pending.\n'
          } >> "$GITHUB_STEP_SUMMARY"
